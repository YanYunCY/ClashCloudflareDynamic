name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Validate example JSON and UTF-8 without BOM
        shell: pwsh
        run: |
          python -c "import json, pathlib; files=list(pathlib.Path('examples').glob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; assert files and all(not p.read_bytes().startswith(b'\xef\xbb\xbf') for p in files)"

      - name: Compile Python
        shell: pwsh
        run: |
          python -m py_compile `
            src/clash_cloudflare_dynamic/__init__.py `
            src/clash_cloudflare_dynamic/dynamic_selector.py `
            src/clash_cloudflare_dynamic/v2rayn_mode.py `
            src/clash_cloudflare_dynamic/health_monitor_launcher.py `
            src/clash_cloudflare_dynamic/storage_maintenance.py `
            tools/build_release.py `
            tools/privacy_check.py `
            tools/sync_check.py

      - name: Build deployment bundle from source
        shell: pwsh
        run: python tools/build_release.py

      - name: Validate source synchronization markers
        shell: pwsh
        run: |
          python tools/sync_check.py `
            --manifest config/sync_markers.json `
            --line opensource=src/clash_cloudflare_dynamic

      - name: Run Python unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -W error::ResourceWarning -m unittest discover -s tests/python -p "test_*.py" -v

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File -Filter *.ps1 | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or
                $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              $failed = $true
              Write-Error "PowerShell UTF-8 BOM missing: $($_.FullName)"
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse failed: $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run setup isolation tests
        shell: powershell
        run: ./tests/windows/test_setup.ps1

      - name: Run install wizard isolation tests
        shell: powershell
        run: ./tests/windows/test_install_wizard.ps1

      - name: Run installer isolation tests
        shell: powershell
        run: ./tests/windows/test_install_hybrid.ps1

      - name: Run v2rayN installer isolation tests
        shell: powershell
        run: ./tests/windows/test_install_v2rayn.ps1

      - name: Run uninstaller isolation tests
        shell: powershell
        run: ./tests/windows/test_uninstall.ps1

      - name: Remove generated caches
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Directory |
            Where-Object { $_.Name -in @("__pycache__", "logs") } |
            Sort-Object FullName -Descending |
            Remove-Item -Recurse -Force

      - name: Run privacy check
        shell: pwsh
        run: python tools/privacy_check.py

      - name: Upload Windows deployment bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClashCloudflareDynamic-windows
          path: dist/ClashCloudflareDynamic.zip
          if-no-files-found: error
